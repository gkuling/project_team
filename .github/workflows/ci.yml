name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "setup.py"

      # CPU wheels first so the editable install below never pulls the
      # multi-gigabyte CUDA builds
      - name: Install CPU torch
        run: uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev extras
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest -m "not network" --cov=project_team --cov-report=term-missing
